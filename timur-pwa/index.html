<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f141b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Тімур: Блокове місто</title>
<style>
/* Layout: full-screen canvas world, thumb joystick bottom-left, action button bottom-right, HUD on top. Single dark look by choice. */
:root{
  --bg:#0f141b; --panel:#1a2330; --panel-2:#243245; --fg:#eef3f7; --muted:#9db0c3;
  --accent:#f2b134; --good:#6fcf5c; --bad:#e5484d;
  --font-display:'Press Start 2P', 'Courier New', monospace;
  --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{display:block;width:100%;height:100%;background:var(--bg)}
#hud{position:absolute;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#left{display:flex;flex-direction:column;gap:6px;min-width:0}
#brand{display:flex;gap:10px;align-items:center}
.badge{width:46px;height:46px;flex:none;display:block;border-radius:8px;border:2px solid var(--accent);object-fit:cover;object-position:50% 30%;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.logo{width:100%;height:190px;display:block;border-radius:8px;border:3px solid var(--panel-2);object-fit:cover;object-position:50% 28%}
#score{font-family:var(--font-display);font-size:18px;color:var(--accent);text-shadow:2px 2px 0 #000}
#scoreLabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#hearts{font-size:20px;letter-spacing:2px;color:var(--bad);text-shadow:1px 1px 0 #000;line-height:1}
#hearts .off{color:#46505c}
#cars{display:flex;gap:6px;pointer-events:auto}
#cars button{font:600 12px var(--font-body);padding:8px 10px;border-radius:6px;border:2px solid var(--panel-2);background:var(--panel);color:var(--fg);cursor:pointer}
#cars button[aria-pressed="true"]{border-color:var(--accent);background:#33291a;color:var(--accent)}
#stick{position:absolute;left:16px;bottom:16px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.22);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(242,177,52,.85);border:2px solid #fff3;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#act{position:absolute;right:16px;bottom:28px;width:104px;height:104px;border-radius:12px;border:3px solid #ffd77a;background:var(--accent);color:#1b1305;font:800 16px var(--font-body);cursor:pointer;box-shadow:0 5px 0 #8a5f0d;touch-action:none}
#act:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5f0d}
#act.dim{opacity:.45}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:156px;background:rgba(0,0,0,.65);padding:8px 12px;border-radius:6px;font-size:13px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#hint.on{opacity:1}
#flash{position:absolute;inset:0;background:rgba(229,72,77,.35);opacity:0;pointer-events:none;transition:opacity .25s}
#flash.on{opacity:1;transition:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,12,18,.78)}
#overlay[hidden]{display:none!important}
.card{width:min(100%,380px);background:var(--panel);border:3px solid var(--panel-2);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.card h1{font-family:var(--font-display);font-size:22px;line-height:1.3;margin:0;color:var(--accent);text-shadow:3px 3px 0 #000;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.card ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--fg)}
.card .big{font-family:var(--font-display);font-size:26px;color:var(--fg)}
#play{font:800 17px var(--font-body);padding:14px;border-radius:8px;border:3px solid #ffd77a;background:var(--accent);color:#1b1305;cursor:pointer;box-shadow:0 4px 0 #8a5f0d}
#play:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5f0d}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-width:380px){#cars button{padding:7px 7px;font-size:11px}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=Press+Start+2P&display=swap">

<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="left">
      <div id="brand">
        <img class="badge" src="timur-logo.jpg" alt="Логотип">
        <div><div id="scoreLabel">Збито ботів</div><div id="score">0</div></div>
      </div>
      <div id="hearts" aria-label="Здоров'я"></div>
    </div>
    <div id="cars" role="group" aria-label="Вибір машини">
      <button type="button" data-car="0" aria-pressed="true">Mercedes</button>
      <button type="button" data-car="1" aria-pressed="false">BMW</button>
      <button type="button" data-car="2" aria-pressed="false">Audi</button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="act" type="button" class="dim">Сісти</button>
  <div id="flash"></div>
  <div id="overlay">
    <div class="card">
      <img class="logo" src="timur-logo.jpg" alt="Логотип гри Тімур">
      <h1 id="ovTitle">Тімур: Блокове місто</h1>
      <div id="ovBody">
        <ul>
          <li>Рухайся джойстиком зліва (на ПК: WASD або стрілки).</li>
          <li>Підійди до машини й натисни «Сісти» (на ПК: E).</li>
          <li>Дави ботів на швидкості. Пішим вони кусаються.</li>
          <li>Мерседес, BMW чи Audi: обери зверху.</li>
        </ul>
      </div>
      <p id="ovBest"></p>
      <button id="play" type="button">Грати</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var T=32, W=80, H=80;
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var vw=0, vh=0, dpr=1, sc=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  vw=cv.clientWidth; vh=cv.clientHeight;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  sc=Math.max(0.9,Math.min(2,Math.min(vw,vh)/380));
}
window.addEventListener('resize',resize); resize();

/* ---------- world ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=mulberry(20261124);
function mkGrid(n){var g=[];for(var i=0;i<(n+1)*(n+1);i++)g.push(R());return g;}
var g1=mkGrid(8), g2=mkGrid(20);
function smooth(t){return t*t*(3-2*t);}
function samp(g,n,x,y){
  var xi=Math.min(n-1,Math.floor(x)), yi=Math.min(n-1,Math.floor(y));
  var fx=smooth(x-xi), fy=smooth(y-yi), s=n+1;
  var a=g[yi*s+xi], b=g[yi*s+xi+1], c=g[(yi+1)*s+xi], d=g[(yi+1)*s+xi+1];
  return (a+(b-a)*fx)*(1-fy)+(c+(d-c)*fx)*fy;
}
var tile=new Uint8Array(W*H), tree=new Uint8Array(W*H);
for(var y=0;y<H;y++)for(var x=0;x<W;x++){
  var h=0.65*samp(g1,8,x/W*8,y/H*8)+0.35*samp(g2,20,x/W*20,y/H*20);
  var t=h<0.36?0:h<0.41?1:h<0.72?2:3;
  tile[y*W+x]=t;
  if(t===2&&R()<0.09)tree[y*W+x]=1;
}
function hash(x,y){var h=(Math.imul(x,73856093)^Math.imul(y,19349663))>>>0;return (h%1000)/1000;}
function isSolidTile(tx,ty){
  if(tx<0||ty<0||tx>=W||ty>=H)return true;
  var i=ty*W+tx, t=tile[i];
  return t===0||t===3||tree[i]===1;
}
function solidAt(px,py){return isSolidTile(Math.floor(px/T),Math.floor(py/T));}
function blocked(x,y,r){return solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r);}

/* spawn point: nearest open grass to the map centre */
var spawn={x:W/2*T,y:H/2*T};
(function(){
  for(var rad=0;rad<40;rad++){
    for(var dy=-rad;dy<=rad;dy++)for(var dx=-rad;dx<=rad;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==rad)continue;
      var tx=W/2+dx, ty=H/2+dy;
      if(tx<4||ty<4||tx>W-5||ty>H-5)continue;
      if(tile[ty*W+tx]===2){spawn.x=(tx+0.5)*T;spawn.y=(ty+0.5)*T;return;}
    }
  }
})();
(function(){
  var cx=Math.floor(spawn.x/T), cy=Math.floor(spawn.y/T);
  for(var dy=-3;dy<=3;dy++)for(var dx=-3;dx<=3;dx++){
    var i=(cy+dy)*W+(cx+dx); tile[i]=2; tree[i]=0;
  }
})();

/* minimap bitmap */
var mm=document.createElement('canvas'); mm.width=W; mm.height=H;
(function(){
  var m=mm.getContext('2d'), cols=['#2f6fb5','#dcc98a','#5fae45','#7b8087'];
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    m.fillStyle=tree[y*W+x]?'#2f7a2c':cols[tile[y*W+x]];
    m.fillRect(x,y,1,1);
  }
})();

/* ---------- game state ---------- */
var BRANDS=[
  {n:'Mercedes',body:'#c3c9cf',roof:'#a5adb5',acc:'#8a939c'},
  {n:'BMW',body:'#2f66c0',roof:'#25509a',acc:'#f2f5f8'},
  {n:'Audi',body:'#b32430',roof:'#8f1c26',acc:'#1b1b1b'}
];
var state='menu', time=0, shake=0;
var p, car, bots, parts, score, best=0;
try{best=parseInt(localStorage.getItem('timur-best')||'0',10)||0;}catch(e){}
var brand=0;

function reset(){
  p={x:spawn.x,y:spawn.y,hp:5,inCar:false,inv:0,face:1,moving:false};
  car={x:spawn.x+64,y:spawn.y,a:0,v:0};
  bots=[];parts=[];score=0;shake=0;
  for(var i=0;i<14;i++)spawnBot(true);
  updateHud();
}
function rand(a,b){return a+Math.random()*(b-a);}
function spawnBot(far){
  for(var k=0;k<60;k++){
    var tx=Math.floor(rand(2,W-2)), ty=Math.floor(rand(2,H-2));
    if(isSolidTile(tx,ty))continue;
    var x=(tx+0.5)*T, y=(ty+0.5)*T;
    if(far&&Math.hypot(x-p.x,y-p.y)<340)continue;
    bots.push({x:x,y:y,a:rand(0,6.28),t:rand(0.5,2),idle:false,face:1,ph:rand(0,6)});
    return;
  }
}

/* ---------- input ---------- */
var keys={}, jx=0, jy=0;
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase(); keys[k]=true;
  if(k==='e'||k===' '||k==='enter'){ if(state==='play'){toggleCar();} e.preventDefault&&k===' '&&e.preventDefault(); }
  if(k==='arrowup'||k==='arrowdown'||k==='arrowleft'||k==='arrowright')e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
window.addEventListener('blur',function(){keys={};jx=0;jy=0;});
function getInput(){
  var x=jx,y=jy;
  if(keys.arrowleft||keys.a)x-=1; if(keys.arrowright||keys.d)x+=1;
  if(keys.arrowup||keys.w)y-=1; if(keys.arrowdown||keys.s)y+=1;
  var m=Math.hypot(x,y);
  if(m>1){x/=m;y/=m;m=1;}
  return {x:x,y:y,m:m};
}
var stick=document.getElementById('stick'), knob=document.getElementById('knob'), stickId=null;
function stickMove(e){
  var r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  var dx=e.clientX-cx, dy=e.clientY-cy, max=r.width/2-8, m=Math.hypot(dx,dy);
  if(m>max){dx=dx/m*max;dy=dy/m*max;}
  jx=dx/max; jy=dy/max;
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
}
stick.addEventListener('pointerdown',function(e){stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e);e.preventDefault();});
stick.addEventListener('pointermove',function(e){if(e.pointerId===stickId)stickMove(e);});
function stickEnd(e){if(e.pointerId!==stickId)return;stickId=null;jx=0;jy=0;knob.style.transform='translate(0,0)';}
stick.addEventListener('pointerup',stickEnd);
stick.addEventListener('pointercancel',stickEnd);

var actBtn=document.getElementById('act');
actBtn.addEventListener('pointerdown',function(e){e.preventDefault();toggleCar();});
document.querySelectorAll('#cars button').forEach(function(b){
  b.addEventListener('click',function(){
    brand=+b.getAttribute('data-car');
    document.querySelectorAll('#cars button').forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});
  });
});

function toggleCar(){
  if(state!=='play')return;
  if(p.inCar){
    var spots=[[0,1],[0,-1],[1,0],[-1,0],[0.7,0.7],[-0.7,0.7],[0.7,-0.7],[-0.7,-0.7]];
    var placed=false;
    for(var i=0;i<spots.length;i++){
      var nx=car.x+spots[i][0]*30, ny=car.y+spots[i][1]*30;
      if(!blocked(nx,ny,7)){p.x=nx;p.y=ny;placed=true;break;}
    }
    if(!placed){p.x=car.x;p.y=car.y;}
    p.inCar=false;
  } else if(Math.hypot(p.x-car.x,p.y-car.y)<52){
    p.inCar=true; p.x=car.x; p.y=car.y;
  }
}

/* ---------- update ---------- */
function moveCircle(o,dx,dy,r){
  if(!blocked(o.x+dx,o.y,r))o.x+=dx; else return 'x';
  return '';
}
function stepEntity(o,dx,dy,r){
  var hit=false;
  if(!blocked(o.x+dx,o.y,r))o.x+=dx; else hit=true;
  if(!blocked(o.x,o.y+dy,r))o.y+=dy; else hit=true;
  return hit;
}
function angDiff(a,b){var d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}

function update(dt){
  time+=dt;
  var inp=getInput();
  if(p.inv>0)p.inv-=dt;
  if(shake>0)shake=Math.max(0,shake-dt);

  if(p.inCar){
    if(inp.m>0.15){
      var target=Math.atan2(inp.y,inp.x), diff=angDiff(car.a,target);
      var turn=3.4*dt;
      car.a+=Math.max(-turn,Math.min(turn,diff));
      var tv=300*inp.m*Math.max(0.35,Math.cos(diff));
      car.v+=(tv-car.v)*Math.min(1,2.6*dt);
    } else {
      car.v*=Math.max(0,1-2.4*dt);
    }
    var cdx=Math.cos(car.a)*car.v*dt, cdy=Math.sin(car.a)*car.v*dt;
    if(stepEntity(car,cdx,cdy,12)){ if(Math.abs(car.v)>120)shake=0.12; car.v*=0.35; }
    p.x=car.x;p.y=car.y;p.moving=false;
  } else {
    car.v*=Math.max(0,1-3*dt);
    if(Math.abs(car.v)>2){stepEntity(car,Math.cos(car.a)*car.v*dt,Math.sin(car.a)*car.v*dt,12);}
    p.moving=inp.m>0.1;
    if(p.moving){
      var sp=125*inp.m;
      stepEntity(p,inp.x*sp*dt,inp.y*sp*dt,7);
      if(Math.abs(inp.x)>0.2)p.face=inp.x>0?1:-1;
    }
  }

  var chaseSpeed=48+Math.min(score,40)*0.9;
  for(var i=bots.length-1;i>=0;i--){
    var b=bots[i], dx=p.x-b.x, dy=p.y-b.y, d=Math.hypot(dx,dy), vx=0, vy=0;
    if(d<300){
      vx=dx/d*chaseSpeed; vy=dy/d*chaseSpeed;
    } else {
      b.t-=dt;
      if(b.t<=0){b.a=rand(0,6.28);b.t=rand(1,3);b.idle=Math.random()<0.3;}
      if(!b.idle){vx=Math.cos(b.a)*36;vy=Math.sin(b.a)*36;}
    }
    if(Math.abs(vx)>4)b.face=vx>0?1:-1;
    var hitW=stepEntity(b,vx*dt,vy*dt,8);
    if(hitW&&d>=300)b.a+=Math.PI*0.7;
    b.ph+=dt*8;

    if(p.inCar&&Math.abs(car.v)>70&&Math.hypot(b.x-car.x,b.y-car.y)<25){
      burst(b.x,b.y);
      bots.splice(i,1);
      score++; shake=0.1;
      continue;
    }
    if(!p.inCar&&d<19&&p.inv<=0){
      p.hp--; p.inv=1; flash();
      if(p.hp<=0){gameOver();return;}
    }
  }
  var want=Math.min(26,14+Math.floor(score/5));
  while(bots.length<want)spawnBot(true);

  for(var j=parts.length-1;j>=0;j--){
    var q=parts[j]; q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.94; q.vy*=0.94;
    if(q.life<=0)parts.splice(j,1);
  }
  updateHud();
}
function burst(x,y){
  var cols=['#7fa36f','#4f6b46','#d83a3a','#2a2f36'];
  for(var i=0;i<16;i++){
    var a=rand(0,6.28), s=rand(40,170);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.4,0.9),c:cols[i%4],s:rand(3,6)});
  }
}
var flashEl=document.getElementById('flash'), flashT=0;
function flash(){flashEl.classList.add('on');clearTimeout(flashT);flashT=setTimeout(function(){flashEl.classList.remove('on');},90);}

/* ---------- HUD ---------- */
var scoreEl=document.getElementById('score'), heartsEl=document.getElementById('hearts'), hintEl=document.getElementById('hint');
var lastHud='';
function updateHud(){
  var near=!p.inCar&&Math.hypot(p.x-car.x,p.y-car.y)<52;
  var key=score+'|'+p.hp+'|'+p.inCar+'|'+near;
  if(key===lastHud)return; lastHud=key;
  scoreEl.textContent=score;
  var h=''; for(var i=0;i<5;i++)h+='<span class="'+(i<p.hp?'':'off')+'">♥</span>';
  heartsEl.innerHTML=h;
  actBtn.textContent=p.inCar?'Вийти':'Сісти';
  actBtn.classList.toggle('dim',!p.inCar&&!near);
  if(p.inCar){hintEl.textContent='Дави ботів на швидкості';hintEl.classList.add('on');}
  else if(near){hintEl.textContent='Натисни «Сісти»';hintEl.classList.add('on');}
  else {hintEl.textContent='Іди до машини (жовта стрілка)';hintEl.classList.add('on');}
}

/* ---------- overlay ---------- */
var overlay=document.getElementById('overlay'), ovTitle=document.getElementById('ovTitle'), ovBody=document.getElementById('ovBody'), ovBest=document.getElementById('ovBest'), playBtn=document.getElementById('play');
var menuHtml=ovBody.innerHTML;
function showMenu(){
  ovTitle.textContent='Тімур: Блокове місто'; ovBody.innerHTML=menuHtml;
  ovBest.textContent=best?('Рекорд: '+best):''; playBtn.textContent='Грати'; overlay.hidden=false;
}
function gameOver(){
  state='over';
  if(score>best){best=score;try{localStorage.setItem('timur-best',String(best));}catch(e){}}
  ovTitle.textContent='Тімура зловили';
  ovBody.innerHTML='<div class="big">'+score+'</div><p>ботів збито за раунд</p>';
  ovBest.textContent='Рекорд: '+best; playBtn.textContent='Ще раз'; overlay.hidden=false;
  hintEl.classList.remove('on');
}
playBtn.addEventListener('click',function(){reset();state='play';overlay.hidden=true;lastHud='';updateHud();});

/* ---------- render ---------- */
var GRASS=['#5fae45','#58a43f','#67b84c'], SAND=['#dcc98a','#d3bf80','#e3d196'], WATER=['#2f6fb5','#2b66a8'], STONE=['#7b8087','#70757c','#868b92'];
function drawTiles(cx,cy,vwW,vhW){
  var x0=Math.max(0,Math.floor(cx/T)), y0=Math.max(0,Math.floor(cy/T));
  var x1=Math.min(W-1,Math.floor((cx+vwW)/T)), y1=Math.min(H-1,Math.floor((cy+vhW)/T));
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){
    var t=tile[ty*W+tx], hv=hash(tx,ty), px=tx*T, py=ty*T, v=Math.floor(hv*3)%3;
    ctx.fillStyle=t===0?WATER[v%2]:t===1?SAND[v]:t===2?GRASS[v]:STONE[v];
    ctx.fillRect(px,py,T+1,T+1);
    if(t===2){
      ctx.fillStyle='rgba(0,0,0,.12)';
      ctx.fillRect(px+4+Math.floor(hv*14),py+5+Math.floor(hv*10),3,3);
      ctx.fillRect(px+20-Math.floor(hv*8),py+18+Math.floor(hv*6),3,3);
    } else if(t===1){
      ctx.fillStyle='rgba(120,90,30,.2)';
      ctx.fillRect(px+6+Math.floor(hv*16),py+8,2,2); ctx.fillRect(px+22,py+20-Math.floor(hv*6),2,2);
    } else if(t===0){
      ctx.fillStyle='rgba(255,255,255,.22)';
      var off=((time*14+hv*40)%T);
      ctx.fillRect(px+off%T*0.6,py+10+Math.floor(hv*8),10,2);
      ctx.fillRect(px+(T-off*0.5)%T*0.8,py+24,8,2);
    } else {
      ctx.fillStyle='rgba(0,0,0,.18)';
      ctx.fillRect(px+4,py+4,12,10); ctx.fillRect(px+16,py+16,12,10);
      ctx.fillStyle='rgba(255,255,255,.1)';
      ctx.fillRect(px+4,py+4,12,3);
    }
  }
}
function drawTrees(cx,cy,vwW,vhW){
  var x0=Math.max(0,Math.floor(cx/T)-1), y0=Math.max(0,Math.floor(cy/T)), x1=Math.min(W-1,Math.floor((cx+vwW)/T)+1), y1=Math.min(H-1,Math.floor((cy+vhW)/T)+2);
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){
    if(!tree[ty*W+tx])continue;
    var px=tx*T, py=ty*T;
    ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(px+4,py+T-6,T-6,6);
    ctx.fillStyle='#6b4423'; ctx.fillRect(px+12,py+14,8,T-12);
    ctx.fillStyle='#2f7a2c'; ctx.fillRect(px+1,py-16,T-2,T-2);
    ctx.fillStyle='#3e9a39'; ctx.fillRect(px+1,py-16,T-2,10);
    ctx.fillStyle='#256322'; ctx.fillRect(px+1,py+8,T-2,6);
  }
}
function drawTimur(x,y,moving,face,tm,flicker){
  if(flicker&&Math.floor(tm*16)%2===0)return;
  var bob=moving?Math.sin(tm*14)*1.5:0, sw=moving?Math.sin(tm*14)*3:0;
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(x-9,y+10,18,5);
  ctx.fillStyle='#2b3a67'; ctx.fillRect(x-6,y+4,5,9+sw/3); ctx.fillRect(x+1,y+4,5,9-sw/3);
  ctx.fillStyle='#1fa0d8'; ctx.fillRect(x-7,y-8+bob,14,13);
  ctx.fillStyle='#1783b3'; ctx.fillRect(x-7,y+2+bob,14,3);
  ctx.fillStyle='#e9b88f'; ctx.fillRect(x-10,y-7+bob+sw/4,3,10); ctx.fillRect(x+7,y-7+bob-sw/4,3,10);
  ctx.fillRect(x-7,y-20+bob,14,13);
  ctx.fillStyle='#3b2517'; ctx.fillRect(x-7,y-21+bob,14,6); ctx.fillRect(x-7,y-16+bob,2,4); ctx.fillRect(x+5,y-16+bob,2,4);
  ctx.fillStyle='#fff'; ctx.fillRect(x-5+face,y-14+bob,4,3); ctx.fillRect(x+1+face,y-14+bob,4,3);
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(x-4+face*2,y-14+bob,2,3); ctx.fillRect(x+2+face*2,y-14+bob,2,3);
  ctx.fillStyle='#b0714c'; ctx.fillRect(x-2,y-9+bob,4,1);
  ctx.font='bold 9px Inter, sans-serif'; ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.7)';
  ctx.strokeText('Тімур',x,y-26+bob); ctx.fillStyle='#fff'; ctx.fillText('Тімур',x,y-26+bob);
}
function drawBot(b){
  var bob=Math.sin(b.ph)*1.2;
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(b.x-8,b.y+9,16,5);
  ctx.fillStyle='#2a2f36'; ctx.fillRect(b.x-5,b.y+3,4,9+bob); ctx.fillRect(b.x+1,b.y+3,4,9-bob);
  ctx.fillStyle='#4f6b46'; ctx.fillRect(b.x-7,b.y-8,14,12);
  ctx.fillStyle='#7fa36f'; ctx.fillRect(b.x-10,b.y-7,3,9); ctx.fillRect(b.x+7,b.y-7,3,9);
  ctx.fillRect(b.x-7,b.y-20,14,13);
  ctx.fillStyle='#6c8a5f'; ctx.fillRect(b.x-7,b.y-20,14,3);
  ctx.fillStyle='#d83a3a'; ctx.fillRect(b.x-5+b.face,b.y-15,3,3); ctx.fillRect(b.x+2+b.face,b.y-15,3,3);
  ctx.fillStyle='#1c2218'; ctx.fillRect(b.x-3,b.y-10,6,2);
}
function drawCar(){
  var br=BRANDS[brand];
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(car.x,car.y+7,25,13,0,0,6.3); ctx.fill();
  ctx.save(); ctx.translate(car.x,car.y); ctx.rotate(car.a);
  ctx.fillStyle='#141414';
  ctx.fillRect(-15,-14,8,4); ctx.fillRect(7,-14,8,4); ctx.fillRect(-15,10,8,4); ctx.fillRect(7,10,8,4);
  ctx.fillStyle=br.body; ctx.fillRect(-22,-11,44,22);
  ctx.fillStyle=br.acc; ctx.fillRect(-22,-1.5,44,3);
  ctx.fillStyle=br.roof; ctx.fillRect(-8,-8,16,16);
  ctx.fillStyle='#9fd0ee'; ctx.fillRect(8,-7,5,14);
  ctx.fillStyle='#3c5870'; ctx.fillRect(-13,-7,4,14);
  ctx.fillStyle='#fff3a0'; ctx.fillRect(20,-9,3,5); ctx.fillRect(20,4,3,5);
  ctx.fillStyle='#e22'; ctx.fillRect(-23,-9,2,5); ctx.fillRect(-23,4,2,5);
  ctx.restore();
}
function render(){
  ctx.setTransform(dpr*sc,0,0,dpr*sc,0,0);
  var vwW=vw/sc, vhW=vh/sc;
  var cx=Math.max(0,Math.min(W*T-vwW,p.x-vwW/2)), cy=Math.max(0,Math.min(H*T-vhW,p.y-vhW/2));
  if(W*T<vwW)cx=(W*T-vwW)/2; if(H*T<vhW)cy=(H*T-vhW)/2;
  var sx=shake>0?(Math.random()-0.5)*6:0, sy=shake>0?(Math.random()-0.5)*6:0;
  ctx.fillStyle='#0f141b'; ctx.fillRect(0,0,vwW+2,vhW+2);
  ctx.save(); ctx.translate(-Math.round(cx)+sx,-Math.round(cy)+sy);
  drawTiles(cx,cy,vwW,vhW);
  if(state!=='menu'||true){
    drawCar();
    for(var i=0;i<bots.length;i++)drawBot(bots[i]);
    if(!p.inCar)drawTimur(p.x,p.y,p.moving,p.face,time,p.inv>0);
    else { /* driver silhouette */
      ctx.save(); ctx.translate(car.x,car.y); ctx.rotate(car.a);
      ctx.fillStyle='#3b2517'; ctx.fillRect(-3,-4,7,8); ctx.restore();
    }
    for(var j=0;j<parts.length;j++){var q=parts[j];ctx.globalAlpha=Math.max(0,Math.min(1,q.life*2));ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s);}
    ctx.globalAlpha=1;
  }
  drawTrees(cx,cy,vwW,vhW);
  /* arrow to car when it is far */
  if(state==='play'&&!p.inCar){
    var dx=car.x-p.x, dy=car.y-p.y, d=Math.hypot(dx,dy);
    if(d>110){
      var a=Math.atan2(dy,dx);
      ctx.save(); ctx.translate(p.x+Math.cos(a)*48,p.y+Math.sin(a)*48-8); ctx.rotate(a);
      ctx.fillStyle='#f2b134'; ctx.strokeStyle='#000'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,-7); ctx.lineTo(-3,0); ctx.lineTo(-6,7); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
  /* minimap (screen space) */
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var ms=Math.min(96,vw*0.24), mx=vw-ms-16, my=56;
  ctx.globalAlpha=0.92; ctx.imageSmoothingEnabled=false; ctx.drawImage(mm,mx,my,ms,ms); ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2; ctx.strokeRect(mx,my,ms,ms);
  var k=ms/(W*T);
  ctx.fillStyle='#d83a3a'; for(var m=0;m<bots.length;m++)ctx.fillRect(mx+bots[m].x*k-1,my+bots[m].y*k-1,2.5,2.5);
  ctx.fillStyle='#f2b134'; ctx.fillRect(mx+car.x*k-2,my+car.y*k-2,4,4);
  ctx.fillStyle='#fff'; ctx.fillRect(mx+p.x*k-2,my+p.y*k-2,4,4);
}

/* ---------- loop ---------- */
reset();
showMenu();
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='play')update(dt); else time+=dt;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
